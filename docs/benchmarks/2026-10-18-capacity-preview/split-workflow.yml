name: Capacity preview diagnostic

on:
  push:
    branches:
      - codex/restore-room-capacity

permissions:
  contents: read
  checks: read

concurrency:
  group: capacity-preview-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Wait for this commit's preview build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            result=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '[.check_runs[] | select(.name == "Workers Builds: bay-drive") | .conclusion] | last // ""')
            if [ "$result" = success ]; then exit 0; fi
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then exit 1; fi
            sleep 10
          done
          echo 'Timed out waiting for the exact preview build'
          exit 1
      - name: Run one bounded preview sample
        run: pnpm exec tsx docs/benchmarks/2026-10-18-capacity-preview/split-session.ts
        env:
          CAPACITY_GROUP: ${{ matrix.group }}
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-preview-${{ github.run_id }}-${{ github.run_attempt }}-group-${{ matrix.group }}
          path: ${{ runner.temp }}/capacity-preview-diagnostic/*.json.gz
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

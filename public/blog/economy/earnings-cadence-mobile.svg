<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1353" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Earnings per five active minutes</title><desc id="chart-description">Each chart shows the median gross earnings in a 30-minute block divided by six, over the first eight active hours. Gross includes cash awards and cab earnings; purchases and fines affect wallet balance. Event bonuses are off. Delivery saver first 30-minute block earns a median $41,002 gross; First cab first 30-minute block earns a median $48,449 gross; Fleet reinvestor first 30-minute block earns a median $48,449 gross; Customizer first 30-minute block earns a median $40,185 gross; Delivery explorer first 30-minute block earns a median $44,388 gross; 30-minute casual first 30-minute block earns a median $39,014 gross; Mixed economy first 30-minute block earns a median $36,457 gross.</desc>

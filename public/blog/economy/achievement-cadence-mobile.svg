<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1507" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Achievements arrive in bursts</title><desc id="chart-description">Each chart shows the mean number of one-off achievements in each 30-minute block. A target of two to four per block applies only to the first two hours. Means can conceal uneven blocks, so the chart reports the percentage of blocks within target. Event bonuses are off, and this is a simulated balanced candidate, not game telemetry. Courier 22.6% of first-two-hour blocks have 2–4 achievements; Explorer 46.3% of first-two-hour blocks have 2–4 achievements; Dome player 6% of first-two-hour blocks have 2–4 achievements; Dome player, no wins 25% of first-two-hour blocks have 2–4 achievements; Racer and parker 20.4% of first-two-hour blocks have 2–4 achievements; Cab operator 21.5% of first-two-hour blocks have 2–4 achievements; Mixed activities 33.8% of first-two-hour blocks have 2–4 achievements.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 445" role="img" aria-labelledby="title description"><title id="title">The first five minutes</title><desc id="description">Four delivery paths show wallet cash at one-minute intervals, using current delivery and achievement rules and assumed task times. A steady delivery path with paint and OTA spends $1,050 by minute five.</desc><rect width="720" height="445" rx="16" fill="white"/><g font-family="system-ui,sans-serif" font-size="15" fill="#253441"><text x="24" y="37" font-size="25" font-weight="700">The first five minutes</text><text x="24" y="64" fill="#536575">Wallet cash at each minute · assumed delivery times</text><line x1="90" x2="660" y1="328" y2="328" stroke="#d5dfe4"/><text x="80" y="333" text-anchor="end" fill="#536575">$0k</text><line x1="90" x2="660" y1="249.66666666666669" y2="249.66666666666669" stroke="#d5dfe4"/><text x="80" y="254.66666666666669" text-anchor="end" fill="#536575">$5k</text><line x1="90" x2="660" y1="171.33333333333334" y2="171.33333333333334" stroke="#d5dfe4"/><text x="80" y="176.33333333333334" text-anchor="end" fill="#536575">$10k</text><line x1="90" x2="660" y1="93" y2="93" stroke="#d5dfe4"/><text x="80" y="98" text-anchor="end" fill="#536575">$15k</text><polyline fill="none" stroke="#1660a1" stroke-width="3" points="90,288.8 204,262.7 318,219.9 432,199.6 546,150.6 660,102.8"/><polyline fill="none" stroke="#13846d" stroke-width="3" points="90,288.8 204,286.9 318,268.3 432,253.8 546,232.5 660,218.1"/><polyline fill="none" stroke="#b05092" stroke-width="3" points="90,302.1 204,300.2 318,283.1 432,268.7 546,249.0 660,234.5"/><polyline fill="none" stroke="#9a5a1e" stroke-width="3" points="90,288.8 204,287.8 318,273.4 432,273.4 546,264.8 660,263.6"/><text x="90" y="353" text-anchor="middle" fill="#536575">0</text><text x="204" y="353" text-anchor="middle" fill="#536575">1</text><text x="318" y="353" text-anchor="middle" fill="#536575">2</text><text x="432" y="353" text-anchor="middle" fill="#536575">3</text><text x="546" y="353" text-anchor="middle" fill="#536575">4</text><text x="660" y="353" text-anchor="middle" fill="#536575">5</text><text x="375" y="374" text-anchor="middle" fill="#536575">Minutes of active play</text><line x1="90" x2="115" y1="385" y2="385" stroke="#1660a1" stroke-width="4"/><text x="124" y="390">Quick delivery</text><line x1="365" x2="390" y1="385" y2="385" stroke="#13846d" stroke-width="4"/><text x="399" y="390">Steady delivery</text><line x1="90" x2="115" y1="413" y2="413" stroke="#b05092" stroke-width="4"/><text x="124" y="418">Steady + OTA and paint</text><line x1="365" x2="390" y1="413" y2="413" stroke="#9a5a1e" stroke-width="4"/><text x="399" y="418">Leisurely delivery</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title description"><title id="title">The first five minutes</title><desc id="description">Five delivery paths show wallet cash at one-minute intervals, using current delivery and achievement rules and assumed task times. The slow path assumes 45 seconds to pickup and 150 seconds to drop-off, ending with $3,250. A steady delivery path with paint and OTA spends $1,050 by minute five.</desc><rect width="720" height="470" rx="16" fill="white"/><g font-family="system-ui,sans-serif" font-size="15" fill="#253441"><text x="24" y="37" font-size="25" font-weight="700">The first five minutes</text><text x="24" y="64" fill="#536575">Wallet cash at each minute · assumed delivery times</text><line x1="90" x2="660" y1="328" y2="328" stroke="#d5dfe4"/><text x="80" y="333" text-anchor="end" fill="#536575">$0k</text><line x1="90" x2="660" y1="210.5" y2="210.5" stroke="#d5dfe4"/><text x="80" y="215.5" text-anchor="end" fill="#536575">$5k</text><line x1="90" x2="660" y1="93" y2="93" stroke="#d5dfe4"/><text x="80" y="98" text-anchor="end" fill="#536575">$10k</text><polyline fill="none" stroke="#1660a1" stroke-width="3" points="90,269.3 204,232.7 318,216.4 432,168.7 546,143.2 660,100.3"/><polyline fill="none" stroke="#13846d" stroke-width="3" points="90,269.3 204,262.7 318,237.0 432,229.1 546,204.7 660,203.5"/><polyline fill="none" stroke="#b05092" stroke-width="3" points="90,289.2 204,282.7 318,259.3 432,251.4 546,229.4 660,228.2"/><polyline fill="none" stroke="#9a5a1e" stroke-width="3" points="90,269.3 204,263.5 318,245.5 432,245.5 546,245.5 660,238.4"/><polyline fill="none" stroke="#283a63" stroke-width="3" stroke-dasharray="6 4" points="90,269.3 204,266.9 318,266.9 432,266.9 546,251.6 660,251.6"/><text x="90" y="353" text-anchor="middle" fill="#536575">0</text><text x="204" y="353" text-anchor="middle" fill="#536575">1</text><text x="318" y="353" text-anchor="middle" fill="#536575">2</text><text x="432" y="353" text-anchor="middle" fill="#536575">3</text><text x="546" y="353" text-anchor="middle" fill="#536575">4</text><text x="660" y="353" text-anchor="middle" fill="#536575">5</text><text x="375" y="374" text-anchor="middle" fill="#536575">Minutes of active play</text><line x1="90" x2="115" y1="385" y2="385" stroke="#1660a1" stroke-width="4"/><text x="124" y="390">Quick delivery</text><line x1="365" x2="390" y1="385" y2="385" stroke="#13846d" stroke-width="4"/><text x="399" y="390">Steady delivery</text><line x1="90" x2="115" y1="413" y2="413" stroke="#b05092" stroke-width="4"/><text x="124" y="418">Steady + OTA and paint</text><line x1="365" x2="390" y1="413" y2="413" stroke="#9a5a1e" stroke-width="4"/><text x="399" y="418">Leisurely delivery</text><line x1="90" x2="115" y1="441" y2="441" stroke="#283a63" stroke-width="4" stroke-dasharray="6 4"/><text x="124" y="446">Slow delivery</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1293" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Earnings per five active minutes</title><desc id="chart-description">Each chart shows the median gross earnings in a 30-minute block divided by six, over the first eight active hours. Gross includes cash awards and cab earnings, and excludes purchases and fines. Event bonuses are off, and this is a simulated balanced candidate, not game telemetry. Courier first 30-minute block earns a median $37,355 gross; Explorer first 30-minute block earns a median $47,320 gross; Dome player first 30-minute block earns a median $37,976 gross; Dome player, no wins first 30-minute block earns a median $28,326 gross; Racer and parker first 30-minute block earns a median $43,490 gross; Cab operator first 30-minute block earns a median $44,230 gross; Mixed activities first 30-minute block earns a median $51,180 gross.</desc>

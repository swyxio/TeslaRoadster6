<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1293" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Earnings per five active minutes</title><desc id="chart-description">Each chart shows the median gross earnings in a 30-minute block divided by six, over the first eight active hours. Gross includes cash awards and cab earnings, and excludes purchases and fines. Event bonuses are off, and this is a simulated core economy design, not game telemetry. Delivery saver first 30-minute block earns a median $40,637 gross; First cab first 30-minute block earns a median $47,949 gross; Fleet reinvestor first 30-minute block earns a median $47,949 gross; Customizer first 30-minute block earns a median $39,850 gross; Delivery explorer first 30-minute block earns a median $44,023 gross; 30-minute casual first 30-minute block earns a median $38,824 gross; Mixed economy first 30-minute block earns a median $36,622 gross.</desc>

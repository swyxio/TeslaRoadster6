<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" role="img" aria-labelledby="title desc"><title id="title">The path to a tower</title><desc id="desc">Median active hours, 250 runs per strategy. Delivery saver: home 17.4, plot 26.4, five floors 36.4, ten floors 55.6, twenty floors 134.7 hours; First cab: home 16, plot 24.2, five floors 33.2, ten floors 50.4, twenty floors 121.5 hours; Fleet reinvestor: home 14.8, plot 21.7, five floors 29, ten floors 43, twenty floors 101.3 hours; Customizer: home 16.7, plot 24.9, five floors 33.9, ten floors 51.2, twenty floors 122.5 hours; Delivery explorer: home 17.7, plot 26.6, five floors 36.3, ten floors 55, twenty floors 132.2 hours; 30-minute casual: home 21.9, plot 32.9, five floors 44.9, ten floors 67.9, twenty floors 163.3 hours; Mixed economy: home 18.6, plot 27.6, five floors 37.3, ten floors 55.8, twenty floors 132.8 hours.</desc><rect width="400" height="680" rx="16" fill="#fff"/><g font-family="system-ui,-apple-system,sans-serif" fill="#1e2933"><text x="24" y="39" font-size="26" font-weight="700">The path to a tower</text><text x="24" y="67" font-size="16" fill="#4d5f6d">Median active hours · 250 runs per path</text><g font-size="13"><circle cx="29" cy="98" r="5" fill="#849aa0"/><text x="40" y="102" >Home</text><circle cx="101" cy="98" r="5" fill="#70a0a2"/><text x="112" y="102" >Plot</text><circle cx="173" cy="98" r="5" fill="#1268a3"/><text x="184" y="102" >5 floors</text><circle cx="245" cy="98" r="5" fill="#bd6a00"/><text x="256" y="102" >10 floors</text><circle cx="317" cy="98" r="5" fill="#91472d"/><text x="328" y="102" >20 floors</text></g><text x="24" y="132" font-size="15" font-weight="600">Delivery saver</text><line x1="30" x2="365" y1="154" y2="154" stroke="#d6dde2" stroke-width="2"/><circle cx="62.4" cy="154" r="5" fill="#849aa0"/><circle cx="79.1" cy="154" r="5" fill="#70a0a2"/><circle cx="97.7" cy="154" r="5" fill="#1268a3"/><circle cx="133.5" cy="154" r="5" fill="#bd6a00"/><circle cx="280.7
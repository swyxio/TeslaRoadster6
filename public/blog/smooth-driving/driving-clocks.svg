<rect x="671.33" y="413" width="10" height="7" rx="2" fill="#ffc88f"/>
<rect x="725.00" y="375" width="50" height="55" rx="4" fill="#254b4a" stroke="#61827b"/>
<path d="M729.00 423 L771.00 423" fill="none" stroke="#79938a" stroke-width="1"/>
<rect x="752.00" y="413" width="10" height="7" rx="2" fill="#a4e6bb"/>
<rect x="791.67" y="375" width="50" height="55" rx="4" fill="#254b4a" stroke="#61827b"/>
<path d="M795.67 423 L837.67 423" fill="none" stroke="#79938a" stroke-width="1"/>
<rect x="818.67" y="413" width="10" height="7" rx="2" fill="#a4e6bb"/>
<rect x="858.33" y="375" width="50" height="55" rx="4" fill="#254b4a" stroke="#61827b"/>
<path d="M862.33 423 L904.33 423" fill="none" stroke="#79938a" stroke-width="1"/>
<rect x="885.33" y="413" width="10" height="7" rx="2" fill="#a4e6bb"/>
<rect x="925.00" y="375" width="50" height="55" rx="4" fill="#254b4a" stroke="#61827b"/>

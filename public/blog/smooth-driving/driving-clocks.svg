<path d="M717.00 364 L717.00 440" fill="none" stroke="#ffc88f" stroke-width="2" stroke-dasharray="4 5"/>
<text x="516.0" y="466" font-size="21" fill="#bad0c5" text-anchor="middle">same position repeated</text>
<text x="916.0" y="466" font-size="21" fill="#bad0c5" text-anchor="middle">jump to the next position</text>
<rect x="40" y="502" width="1120" height="56" rx="9" fill="#254b4a"/>
<text x="60" y="537" font-size="22" fill="#f2f7ee" font-weight="600">A fast frame can redraw an old position; smooth motion needs a position between updates.</text>
</g></svg>

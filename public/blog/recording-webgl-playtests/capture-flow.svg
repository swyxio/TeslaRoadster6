<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">From a playtest to a published video</title>
  <desc id="desc">Scenario and local room to Chromium pixels, to MP4 and poster, to the dev blog. Run evidence remains private.</desc>
  <rect width="1200" height="300" rx="16" fill="#f7f7f5"/>
  <g font-family="Arial, sans-serif" fill="#222b2d" text-anchor="middle">
    <g font-size="19" font-weight="bold">
      <rect x="25" y="36" width="248" height="108" rx="12" fill="#cfe5fb" stroke="#2f7ed8" stroke-width="2"/>
      <text x="149" y="75">Scenario + local room</text><text x="149" y="107" font-size="16" font-weight="normal">Timed inputs, fresh start</text>
      <rect x="326" y="36" width="248" height="108" rx="12" fill="#ddf4d2" stroke="#4f9a51" stroke-width="2"/>
      <text x="450" y="75">Chromium renders</text><text x="450" y="107" font-size="16" font-weight="normal">WebGL pixels → WebM</text>
      <rect x="626" y="36" width="248" height="108" rx="12" fill="#cfe5fb" stroke="#2f7ed8" stroke-width="2"/>
      <text x="750" y="75">Prepare the clip</text><text x="750" y="107" font-size="16" font-weight="normal">MP4 + poster</text>
      <rect x="927" y="36" width="248" height="108" rx="12" fill="#ffd5d5" stroke="#d84b4b" stroke-width="2"/>
      <text x="1051" y="75">Publish with the blog</text><text x="1051" y="107" font-size="16" font-weight="normal">Site build and deploy</text>
    </g>
    <rect x="326" y="205" width="248" height="62" rx="10" fill="#ffe7b2" stroke="#c88419" stroke-width="2"/>
    <text x="450" y="231" font-size="16" font-weight="bold">Private run artifacts</text><text x="450" y="252" font-size="15">manifest + trajectory</text>
  </g>
  <g stroke="#5e646b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M273 90h45"/><path d="M574 90h44"/><path d="M874 90h45"/><path d="M450 144v52" stroke-dasharray="6 5"/></g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5e646b"/></marker></defs>
</svg>

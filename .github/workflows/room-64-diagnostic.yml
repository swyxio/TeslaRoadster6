name: Historical 64-player room research

# The target is deliberately unconfigured. A push to this one diagnostics
# branch starts identity checks; an unapproved target fails before any load.
on:
  push:
    branches: [codex/64-player-room-diagnostic]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: room-64-diagnostic
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      base: ${{ steps.target.outputs.base }}
      preview: ${{ steps.target.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic
          persist-credentials: false
      - id: target
        name: Validate the explicitly approved immutable preview
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          import {verifyConfig} from './diagnostic/scripts/room-64-target.mjs';
          const target=JSON.parse(readFileSync('diagnostic/scripts/room-64-target.json','utf8'));
          verifyConfig(target);
          appendFileSync(process.env.GITHUB_OUTPUT,`sha=${target.sha}\nbase=${target.baseSha}\npreview=${target.preview}\n`);
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source and build matching static assets
        working-directory: candidate
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          BASE_SHA: ${{ steps.target.outputs.base }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          pnpm install --frozen-lockfile
          pnpm exec vite build --manifest
      - name: Verify PR, preview isolation and served assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PREVIEW: ${{ steps.target.outputs.preview }}
        run: |
          mkdir -p "$RUNNER_TEMP/room-64-identity"
          node diagnostic/scripts/room-64-target.mjs diagnostic/scripts/room-64-target.json candidate/wrangler.jsonc > "$RUNNER_TEMP/room-64-identity/target.json"
          node --test diagnostic/scripts/room-64-target.test.mjs
          cd candidate
          node --input-type=module -e 'import {measureGraph} from "./scripts/performance-baseline-assets.mjs"; import {writeFileSync} from "node:fs"; writeFileSync(process.env.RUNNER_TEMP+"/room-64-identity/assets.json",JSON.stringify({initialStaticJavaScript:measureGraph("dist","dist")},null,2));'
          node scripts/performance-transfer.mjs "$TARGET_PREVIEW" "$RUNNER_TEMP/room-64-identity/assets.json" 1 > "$RUNNER_TEMP/room-64-identity/served-assets.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-64-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/room-64-identity/
          if-no-files-found: warn
          retention-days: 14

  paired-assembly:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.base }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact base and candidate, and prepare identical benchmark
        env:
          TARGET_SHA: ${{ needs.identity.outputs.sha }}
          BASE_SHA: ${{ needs.identity.outputs.base }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          git -C candidate merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
          test -f candidate/scripts/bench-snapshot-assembly.ts
          cp candidate/scripts/bench-snapshot-assembly.ts base/scripts/bench-snapshot-assembly.ts
          cmp candidate/scripts/bench-snapshot-assembly.ts base/scripts/bench-snapshot-assembly.ts
          mkdir -p "$RUNNER_TEMP/room-64-assembly"
          shasum -a 256 candidate/scripts/bench-snapshot-assembly.ts base/scripts/bench-snapshot-assembly.ts candidate/pnpm-lock.yaml base/pnpm-lock.yaml > "$RUNNER_TEMP/room-64-assembly/source-sha256.txt"
          printf 'base=%s\ncandidate=%s\nstarted=%s\n' "$BASE_SHA" "$TARGET_SHA" "$(date -u +%FT%TZ)" > "$RUNNER_TEMP/room-64-assembly/context.txt"
          node --version >> "$RUNNER_TEMP/room-64-assembly/context.txt"
          uname -a >> "$RUNNER_TEMP/room-64-assembly/context.txt"
          (cd candidate && pnpm install --frozen-lockfile)
          (cd base && pnpm install --frozen-lockfile)
      - name: Run alternating bounded assembly samples on the same runner
        run: |
          for pair in 1 2 3; do
            if [ "$pair" = 2 ]; then order='candidate base'; else order='base candidate'; fi
            for side in $order; do
              (cd "$side" && pnpm exec tsx scripts/bench-snapshot-assembly.ts 50) > "$RUNNER_TEMP/room-64-assembly/${pair}-${side}.jsonl"
            done
          done
          date -u +%FT%TZ >> "$RUNNER_TEMP/room-64-assembly/context.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-64-assembly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/room-64-assembly/
          if-no-files-found: warn
          retention-days: 14

  sample:
    needs: [identity, paired-assembly]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recheck exact target and prepare harness
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.identity.outputs.sha }}
          BASE_SHA: ${{ needs.identity.outputs.base }}
        run: |
          mkdir -p "$RUNNER_TEMP/capacity-preview-diagnostic"
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          git -C candidate merge-base --is-ancestor "$BASE_SHA" HEAD
          node diagnostic/scripts/room-64-target.mjs diagnostic/scripts/room-64-target.json candidate/wrangler.jsonc > "$RUNNER_TEMP/capacity-preview-diagnostic/identity-before.json"
          cp diagnostic/scripts/room-64-diagnostic.ts diagnostic/scripts/room-64-observations.ts diagnostic/scripts/room-64-observations.test.ts diagnostic/scripts/room-64-corridors.ts diagnostic/scripts/room-64-target.json candidate/scripts/
          cd candidate
          pnpm install --frozen-lockfile
          pnpm exec tsx --test scripts/room-64-observations.test.ts
      - name: Run one bounded sandbox sample
        working-directory: candidate
        env:
          TARGET_SOURCE_SHA: ${{ needs.identity.outputs.sha }}
          TARGET_PREVIEW_URL: ${{ needs.identity.outputs.preview }}
          ROOM64_APPROVED: 'true'
          CAPACITY_GROUP: ${{ matrix.group }}
        run: pnpm exec tsx scripts/room-64-diagnostic.ts
      - name: Recheck exact target after sampling
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f candidate/wrangler.jsonc; then
            node diagnostic/scripts/room-64-target.mjs diagnostic/scripts/room-64-target.json candidate/wrangler.jsonc > "$RUNNER_TEMP/capacity-preview-diagnostic/identity-after.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-64-${{ github.run_id }}-${{ github.run_attempt }}-group-${{ matrix.group }}
          path: ${{ runner.temp }}/capacity-preview-diagnostic/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: sample
    if: always() && needs.sample.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: room-64-${{ github.run_id }}-${{ github.run_attempt }}-group-*
          path: reports
      - name: Require one complete, coordinated room across all four runners
        run: |
          node scripts/room-64-aggregate.mjs reports
          echo "Historical research only: current-main release verification is intentionally not satisfied."
          exit 1

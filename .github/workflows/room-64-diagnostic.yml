name: Legacy 64-player diagnostic disabled

# This branch previously ran load on push. Keep it inert; the replacement is
# manually dispatched from a separate branch based on current main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Stop without opening any connections
        run: |
          echo 'This legacy diagnostic branch is disabled. Use the manual-only workflow from current main.'
          exit 1
